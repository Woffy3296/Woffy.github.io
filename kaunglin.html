<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            padding: 20px;
            text-align: center;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Car Website</h1>
        <p>Discover amazing cars</p>
    </header>

    <div class="container">
        <h2>Featured Car</h2>
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6e/2018_Toyota_Camry_SE_front_3.5.18.jpg" alt="Car Image">
        <p>This is a modern and stylish car with great performance and comfort.</p>
    </div>

    <footer>
        <p>&copy; 2026 Car Website</p>
    </footer>

</body>
</html>
